name = "opengov-proxy"
main = "worker.js"
compatibility_date = "2026-04-01"

# Leave workers_dev = true so the Worker is reachable at
# https://opengov-proxy.<your-subdomain>.workers.dev after deploy.
workers_dev = true

# Workers AI binding — powers reliable, no-key "Free mode" LLM (Llama 3.3 70B).
# Free allocation: 10,000 Neurons/day, included on the free Workers plan.
[ai]
binding = "AI"

# Cross-reference index origin, fronted by the /xref route. Pages stays the
# canonical publisher; this Worker only caches it and puts the index on the
# same origin as the rest of the API. Override to front a different publisher.
[vars]
XREF_ORIGIN = "https://hbt89.github.io/government-data-fun/data"
