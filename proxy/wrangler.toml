name = "opengov-proxy"
main = "worker.js"
compatibility_date = "2026-04-01"

# Leave workers_dev = true so the Worker is reachable at
# https://opengov-proxy.<your-subdomain>.workers.dev after deploy.
workers_dev = true

# Workers AI binding — powers reliable, no-key "Free mode" LLM (Llama 3.3 70B).
# Free allocation: 10,000 Neurons/day, included on the free Workers plan.
[ai]
binding = "AI"

# Cross-reference index origin, fronted by the /xref route. Pages stays the
# canonical publisher; this Worker only caches it and puts the index on the
# same origin as the rest of the API. Override to front a different publisher.
[vars]
XREF_ORIGIN = "https://selvidge.tech/government-data-fun/data"

# Curated tier, served by /curated to named consumers only. These are vars, not
# secrets: they name where the data is and who may send a token, neither of
# which is confidential.
#
# The two secrets this route needs are set out of band and never live here:
#   wrangler secret put CURATED_TOKEN    # the bearer token a consumer presents
#   wrangler secret put GITHUB_TOKEN     # read-only PAT for the curated repo
#
# With CURATED_TOKEN unset the route answers 503 rather than serving anything,
# so a half-configured deploy cannot expose the tier.
CURATED_REPO = "HBT89/govdata-curated"
CURATED_ALLOWED_ORIGINS = "http://localhost:5173"
